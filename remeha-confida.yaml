# AP058 - instelbare parameter (waarschuwingsdrempel lage waterdruk, U8, 0.1 bar).
# Wordt elke poll gelezen zodat de getoonde waarde met het toestel blijft kloppen; schrijft
# alleen bij een wijziging (operation 0x04), de volgende read bevestigt/corrigeert die waarde.
# read: single -> deze scalar zit NIET in de bulk-GetList, dus los opvragen (operation 0x00).
# min/max hieronder zijn redelijke UI-grenzen (de echte toestelgrens is niet publiek bekend).
number:
  - platform: remeha_confida
    name: "Waarschuwing dat druk laag is (AP058)"
    index: 0x302B
    value_type: u8
    gain: 0.1
    unit_of_measurement: "bar"
    device_class: pressure
    read: single
    min_value: 0.3
    max_value: 3.0
    step: 0.1
    mode: box
    entity_category: config
    icon: mdi:gauge-low

  # --- Zone-/stooklijnparameters (instelbaar). Deze staan WEL in de bulk-GetList, dus read: bulk
  # (standaard) volstaat; de 0x34xx-zoneobjecten zitten op subindex 1 = de actieve zone (CIRCA),
  # PP018 is een scalar op subindex 0. min/max zijn UI-grenzen (de range zit niet in de OBD;
  # alleen de technische U8/U16-range is bekend). LET OP: dit zijn echte stooklijninstellingen -
  # wijzigen beinvloedt je verwarming. Wil je er een alleen-lezen van maken, zet 'm dan als sensor.
  - platform: remeha_confida
    name: "Hellingshoek stooklijn van deze groep (CP230)"
    index: 0x3416
    subindex: 1
    value_type: u8
    gain: 0.1
    min_value: 0.0
    max_value: 4.0
    step: 0.1
    mode: box
    entity_category: config
    icon: mdi:chart-line-variant
