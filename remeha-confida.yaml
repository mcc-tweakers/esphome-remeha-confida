  - platform: remeha_confida
    name: "Nachtvoetpunt stooklijn van deze groep (CP220)"
    index: 0x3415
    subindex: 1
    value_type: u16
    gain: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 10
    max_value: 90
