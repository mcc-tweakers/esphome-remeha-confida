# =====================================================================
#  Remeha Confida 40  ->  Home Assistant via ESPHome (onboard Bluetooth)
#  Geen GTW-08 nodig. Flash deze YAML op een ESP32 via ESPHome.
#
#  Vul in secrets.yaml van je ESPHome in:
#     wifi_ssid / wifi_password
#     remeha_bt_key   : het 6-cijferige nummer van de BLE-sticker op je Confida
#
#  MAC invullen hoeft NIET: standaard zoekt de ESP zelf naar een toestel met een
#  naam die begint met "EHC-" en verbindt met de eerste. Heb je meerdere
#  toestellen, kijk dan in de ESPHome-log: elk gezien BLE-apparaat wordt daar met
#  naam + MAC gelogd ("BLE gezien: ..."). Zet de juiste MAC dan hieronder onder
#  'substitutions' bij ble_mac, zodat de ESP altijd met dat ene toestel verbindt.
#
#  Gebruik op eigen risico. Slechts een BLE-
#  verbinding tegelijk: terwijl de ESP leest, kan een telefoon niet verbinden
#  (gebruik daarvoor de schakelaar "Remeha uitlezing").
# =====================================================================

substitutions:
  device_name: remeha-confida
  friendly_name: "Remeha Confida"
  # Laat dit op 00:00:00:00:00:00 staan om automatisch op naam ("EHC-...") te
  # zoeken. Vul het MAC van JOUW Confida in als je meerdere toestellen hebt
  # (MAC vind je met nRF Connect of in de ESPHome-log, regel "BLE gezien: ...").
  ble_mac: "00:00:00:00:00:00"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev          # pas aan als je een ander ESP32-board hebt
  framework:
    type: esp-idf          # esp_ble_passkey_reply / set_encryption vereisen IDF

logger:
  level: DEBUG              # zet op DEBUG om al het BLE-verkeer mee te lezen
  logs:
    remeha_confida: DEBUG
    esp32_ble_tracker: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
web_server:
  version: 3
  port: 80

# De component (de C++/Python-driver) wordt bij het compileren uit de publieke
# repo gehaald. Geen token nodig.
external_components:
  # Ontwikkel-/testopstelling: de component staat in de map 'components' naast
  # deze YAML. Zet die map in je ESPHome-config naast remeha-confida.yaml.
  - source:
      type: local
      path: components
    components: [remeha_confida]
  # Voor de publieke release wordt dit de GitHub-bron (publiek, geen token):
  #   - source: github://mcc-tweakers/esphome-remeha-confida@main
  #     components: [remeha_confida]

# Handmatige herstartknop (verschijnt in HA en de webinterface).
button:
  - platform: restart
    name: "Remeha ESP herstart"
    icon: mdi:restart

# Schakelaar om de uitlezing aan/uit te zetten. UIT = de ESP laat de BLE-verbinding
# los en stopt met herverbinden, zodat een telefoon of een installateur kan
# verbinden. AAN = weer uitlezen. Na een herstart standaard AAN.
switch:
  - platform: template
    name: "Remeha uitlezing"
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(confida).set_active(true);'
    turn_off_action:
      - lambda: 'id(confida).set_active(false);'

esp32_ble:
  io_capability: keyboard_only   # wij leveren de passkey (het stickernummer)

esp32_ble_tracker:

ble_client:
  - mac_address: ${ble_mac}
    id: confida_client

remeha_confida:
  id: confida
  ble_client_id: confida_client
  update_interval: 30s
  # Vaste GATT-UUIDs van de Confida BLE-module (gelijk voor alle Confida's. Als het goed is.....).
  service_uuid: "f8fc98e4-5919-4a5c-852e-dfe04ad383c0"
  write_uuid:   "496b1b03-cebc-4d59-9c32-14ea88c266f9"
  notify_uuid:  "ab9af948-fb86-492d-820d-bdea2dcb7ecf"
  passkey: !secret remeha_bt_key      # 6-cijferig stickernummer
  # Naam-prefix voor automatisch zoeken (alleen gebruikt als ble_mac 0 is):
  device_name_prefix: "EHC-"
  # Diagnose-entiteiten in HA: schrijfresultaat, laatste herverbind-reden, teller.
  write_result:
    name: "Remeha laatste schrijfresultaat"
  reconnect_reason:
    name: "Remeha laatste herverbind-reden"
  reconnect_count:
    name: "Remeha herverbindingen"

# --- Uitgelezen waarden (EHC-16)  (selectie van de meest nuttige objecten). ---
